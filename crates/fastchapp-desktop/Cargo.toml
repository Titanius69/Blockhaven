[package]
name = "fastchapp-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"

[features]
default = ["native"]
native = ["dep:tao", "dep:wry"]
dev = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }

