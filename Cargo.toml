[workspace]
members = ["crates/fastchapp-desktop", "crates/blockhaven-installer"]
default-members = [".", "crates/blockhaven-installer"]
resolver = "2"

[package]
name = "blockhaven"
version = "0.3.2"
edition = "2021"
license = "MIT"
build = "build.rs"

[features]
default = ["native"]
native = ["fastchapp-desktop/native", "dep:rfd", "dep:webbrowser"]
dev = ["fastchapp-desktop/dev"]

[dependencies]
fastchapp-desktop = { path = "crates/fastchapp-desktop", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
dirs = "6"
rfd = { version = "0.17", optional = true }
webbrowser = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
sha1 = "0.10"

[profile.release]
strip = true
codegen-units = 1

